[project]
name = "calc"
version = "1.0.0"
description = "Apply a colored tint (--color red|green|blue|yellow|...) to an image."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
