[project]
name = "warhol-cleanup"
version = "1.0.0"
description = "PC8 — cleanup-on-failure marker."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
