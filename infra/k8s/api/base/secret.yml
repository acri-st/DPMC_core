# Sensitive API config. Dev defaults carried over from apps/api/.env.example —
# ROTATE all of these for a real deployment and move them off git
# (SealedSecret / ExternalSecret).
#
# DATABASE_URL points at the in-cluster `database` Service (user/pw = postgres,
# matching infra/k8s/database). KEYCLOAK_CLIENT_SECRET is omitted: the dpmc-api
# client is public (publicClient: true in keycloak.json), so no secret is used.
apiVersion: v1
kind: Secret
metadata:
  name: api
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@database:5432/postgres
  # dpmc-api is a PUBLIC client (PKCE), so it has no secret. The value must
  # still be PRESENT (empty), because ConfigService.get() exit(1)s on any
  # undefined key; the auth code treats an empty string as "no secret". A
  # non-empty value would be sent to Keycloak and rejected for a public client.
  # Set a real value here only if you switch dpmc-api to a confidential client.
  KEYCLOAK_CLIENT_SECRET: ""
  # >= 40 chars (zod schema). Dev key — replace in prod.
  SESSION_ENCRYPTION_KEY: ZHBtYy1kZXYtc2Vzc2lvbi1rZXktMzItYnl0ZXMhISE=
  # >= 20 chars. Shared with workers at registration time.
  WORKER_REGISTRATION_TOKEN: dev-worker-registration-token-min20chars
  S3_ACCESS_KEY: admin
  S3_SECRET_KEY: adminadmin
