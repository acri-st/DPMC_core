apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eocp-dev

# No Service/Ingress: workers long-poll the API, nothing connects to them.
resources:
  - serviceaccount.yml
  - rbac.yml
  - pvc.yml
  - secret.yml
  - configmap.yml
  - deployment.yml

labels:
  - includeSelectors: true
    pairs:
      app: worker
