# MUST equal WORKER_REGISTRATION_TOKEN in the api Secret — rotate together.
apiVersion: v1
kind: Secret
metadata:
  name: worker
type: Opaque
stringData:
  DPMC_WORKER_TOKEN: dev-worker-registration-token-min20chars
  # MinIO root credentials — MUST match S3_ACCESS_KEY/S3_SECRET_KEY in the
  # api Secret and infra/k8s/s3. Dev defaults; ROTATE together.
  S3_ACCESS_KEY: admin
  S3_SECRET_KEY: adminadmin
