# DPMC application database credentials.
#
# These are the dev defaults carried over from docker-compose.yml. They are
# committed only because they match the non-secret dev profile; ROTATE them for
# a real deployment (e.g. via a SealedSecret / ExternalSecret) instead of
# storing the live password in git.
apiVersion: v1
kind: Secret
metadata:
  name: database
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
