apiVersion: batch/v1
kind: Job
metadata:
  name: dpmc-seed
  namespace: eocp-dev
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: dpmc-seed
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: dpmc-api:minikube
          imagePullPolicy: IfNotPresent
          workingDir: /app/packages/prisma
          command:
            - node_modules/.bin/tsx
            - prisma/seed.ts
          envFrom:
            - configMapRef:
                name: api
            - secretRef:
                name: api
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi