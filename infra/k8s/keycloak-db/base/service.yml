# Headless service: stable DNS `keycloak-db.eocp.svc.cluster.local`, targeted by
# Keycloak via KC_DB_URL_HOST.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
spec:
  clusterIP: None
  selector:
    app: keycloak-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
