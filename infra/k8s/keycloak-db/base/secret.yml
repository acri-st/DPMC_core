# Dedicated Keycloak database credentials, kept separate from the DPMC
# application database so identity data is backed up / scaled on its own.
#
# Dev defaults from docker-compose.yml — ROTATE for a real deployment and move
# off git (SealedSecret / ExternalSecret).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
type: Opaque
stringData:
  POSTGRES_USER: keycloak
  POSTGRES_PASSWORD: keycloak
  POSTGRES_DB: keycloak
