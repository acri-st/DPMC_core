# Sensitive dispatcher config. Dev defaults carried over — ROTATE for a real
# deployment and move off git (SealedSecret / ExternalSecret), together with
# the api Secret.
#
# DATABASE_URL points at the in-cluster `database` Service (same credentials
# as infra/k8s/database). API_TOKEN is sent as X-Worker-Token and MUST equal
# WORKER_REGISTRATION_TOKEN in the api Secret — rotate the two together.
apiVersion: v1
kind: Secret
metadata:
  name: dispatcher
type: Opaque
stringData:
  DPMC_DISPATCHER_DATABASE_URL: postgresql://postgres:postgres@database:5432/postgres
  DPMC_DISPATCHER_API_TOKEN: dev-worker-registration-token-min20chars
