apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eocp-dev

# Static aux data volume for the CryoSat Ocean chains: PVC + one-shot
# bootstrap Job that fills it from the dpmc-static MinIO bucket. Apply after
# the worker base (reuses its ConfigMap/Secret for MinIO access).
resources:
  - pvc.yml
  - job.yml

labels:
  - includeSelectors: true
    pairs:
      app: cryosat-sad
