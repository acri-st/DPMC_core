# Keycloak bootstrap admin (master realm). Dev defaults from
# docker-compose.yml — ROTATE for a real deployment and move off git
# (SealedSecret / ExternalSecret). The DB credentials are NOT here: Keycloak
# reads them from the existing `keycloak-db` Secret (see deployment.yml).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
