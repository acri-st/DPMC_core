apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eocp-dev

resources:
  - secret.yml
  - service.yml
  - statefulset.yml
  - bucket-job.yml

labels:
  # includeSelectors:false — selectors/templates are hardcoded; injecting a
  # selector into the bucket Job (immutable, system-managed) would break it.
  - includeSelectors: false
    pairs:
      app: s3
