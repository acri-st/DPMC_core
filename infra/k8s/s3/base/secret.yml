# MinIO root credentials. MUST match the API's S3_ACCESS_KEY / S3_SECRET_KEY
# (infra/k8s/api) — the API authenticates to MinIO with these. Dev defaults
# from docker-compose.yml; ROTATE for a real deployment (and update both sides).
apiVersion: v1
kind: Secret
metadata:
  name: s3
type: Opaque
stringData:
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: adminadmin
