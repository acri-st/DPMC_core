apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  annotations:
    field.cattle.io/description: DPMC docs (static site)
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dpmc-docs.operation.acrist-services.com
      secretName: star.acrist-services.com
  rules:
    - host: dpmc-docs.operation.acrist-services.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  number: 80
