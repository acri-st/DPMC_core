# nginx server for the DPMC web SPA (TanStack Router, client-side routing).
# The nginx-unprivileged image listens on 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the content-hashed build assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths are served index.html so client-side routes
    # resolve on direct navigation / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
