[project]
name = "dispatcher"
version = "0.2.0"
description = "DPMC orchestration service: task / dependency / dispatch / monitor / aging loops."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "watchfiles>=0.24",
]

# This is an internal long-running service, not a published library.
# It is launched via `uv run python src/main.py` and `pythonpath` makes
# `src/` the implicit package root, so the layers (`domain`,
# `infrastructure`, `repositories`, `services`) are top-level packages.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
